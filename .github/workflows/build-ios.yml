name: Build iOS (unsigned IPA)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select newest Xcode (Expo SDK 58 needs Swift 6.2+)
        run: |
          ls -d /Applications/Xcode_*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        run: cd ios && pod install
      - name: Build unsigned app
        run: |
          xcodebuild -workspace ios/*.xcworkspace -scheme MyMusic -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/MyMusic.app Payload/
          zip -qr MyMusic-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MyMusic-unsigned.ipa
          path: MyMusic-unsigned.ipa
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MyMusic-unsigned.ipa
