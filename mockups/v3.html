<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockups v3 — gallery direction</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--fg:#141414;--mute:#8a867c;--line:#d9d4c8;--card:#ebe7dc;--accent:#d8431f;--ok:#3fa86b;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;--serif:"Instrument Serif",Georgia,serif}
:root[data-theme=dark]{--bg:#0f0f0e;--fg:#ece8dd;--mute:#7d796f;--line:#2a2927;--card:#191917;--accent:#ff6a3d}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]):not([data-theme=dark]){--bg:#0f0f0e;--fg:#ece8dd;--mute:#7d796f;--line:#2a2927;--card:#191917;--accent:#ff6a3d}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:400 12px/1.5 var(--mono);padding:24px 16px 64px}
header{max-width:1100px;margin:0 auto 28px}
header h1{font:italic 400 28px var(--serif)}
header p{color:var(--mute)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:0}
svg{display:block;fill:currentColor}
.row{max-width:1100px;margin:0 auto;display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
figure{width:300px}
figcaption{color:var(--mute);margin-bottom:8px}
.phone{height:640px;border:1px solid var(--line);background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:18px 16px 12px}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);margin-bottom:16px;min-height:24px}
.top button{color:var(--fg)}
h2{font:italic 400 34px/1 var(--serif);margin-bottom:4px}
.sub{color:var(--mute)}
.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:9px 0;color:var(--mute)}
.tabs .on{color:var(--fg);border-bottom:1px solid var(--fg)}
.art{aspect-ratio:1;background:#888;flex:none}
.a1{background:linear-gradient(135deg,#d8431f,#f2b66d)}
.a2{background:radial-gradient(circle at 30% 30%,#e9e2cf 0 18%,#2d4a3e 19%)}
.a3{background:repeating-linear-gradient(90deg,#1b1b1b 0 6px,#e8e1cf 6px 12px)}
.a4{background:conic-gradient(from 90deg,#3b5ba5,#e8c9d0,#3b5ba5)}
.a5{background:linear-gradient(#e8c9d0 50%,#7a1f2b 50%)}
.a6{background:radial-gradient(circle,#f2b66d 0 30%,#1d2a44 31%)}
.collage{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;flex:none}
.sect{color:var(--mute);margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.sect b{font:italic 400 20px var(--serif);color:var(--fg)}
/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:8px;background:var(--card);overflow:hidden;min-width:0}
.tile .art,.tile .collage{width:44px}
.tile span{font-weight:500;line-height:1.2;padding-right:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:7px 0;background:var(--bg)}
.li .art{width:44px}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .dots{padding:8px 2px 8px 10px;color:var(--mute)}
/* swipe to queue */
.sw{position:relative;overflow:hidden}
.sw .bg{position:absolute;inset:0;display:flex;align-items:center;gap:8px;padding-left:14px;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,var(--bg));opacity:0}
.sw .bg .ic{position:relative;width:20px;height:20px}
.sw .bg .ic svg{position:absolute;inset:0;transition:opacity .2s,transform .25s}
.sw .bg .ic .ck{opacity:0;transform:scale(.4)}
.sw .fg{position:relative;touch-action:pan-y;cursor:grab;user-select:none}
.sw .fg.snap{transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sw.done .bg{opacity:1;animation:flash .9s ease-out forwards}
.sw.done .bg .ic .q{opacity:0;transform:scale(.4)}
.sw.done .bg .ic .ck{opacity:1;transform:none}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 34%,var(--bg))}100%{background:color-mix(in srgb,var(--accent) 10%,var(--bg));opacity:0}}
.sw.done .fg .t b{animation:pulse .9s ease-out}
@keyframes pulse{0%,30%{color:var(--accent)}100%{color:inherit}}
.toast{position:absolute;left:16px;right:16px;bottom:62px;background:var(--fg);color:var(--bg);padding:9px 12px;display:flex;justify-content:space-between;
  transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}
.toast.show{transform:none;opacity:1}
.badge{background:var(--accent);color:var(--bg);border-radius:99px;padding:0 6px;margin-left:4px;font-size:10px}
.mini{border-top:1px solid var(--line);padding:8px 16px;display:flex;gap:10px;align-items:center}
.mini .art{width:36px}.mini .t{flex:1;min-width:0}
/* queue */
.help{border:1px solid var(--line);padding:9px 12px;color:var(--mute);margin-bottom:6px;position:relative}
.help b{color:var(--fg);font-weight:500}
.q .li{padding:6px 0}
.q .li.drag{opacity:.4}
.q .x,.q .h{color:var(--mute);padding:8px 4px}
.q .h{cursor:grab}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px;width:14px}
.eq i{flex:1;background:var(--accent);animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 4px}
.grp b{font:italic 400 20px var(--serif)}
.grp span{color:var(--mute)}
.note{color:var(--mute);margin-bottom:4px}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);text-align:center}
/* settings */
.set .grp{margin-top:22px}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--mute)}
.item .v{color:var(--mute)}
.seg{display:flex;border:1px solid var(--fg)}
.seg button{padding:3px 11px;color:var(--fg)}
.seg button.on{background:var(--fg);color:var(--bg)}
.tg{width:38px;height:20px;border:1px solid var(--fg);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--fg);transition:.2s}
.tg.on{background:var(--fg)}.tg.on::after{left:20px;background:var(--bg)}
.danger{color:var(--accent)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></symbol>
  <symbol id="pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></symbol>
  <symbol id="queue" viewBox="0 0 24 24"><path d="M3 6h14v2H3zm0 5h14v2H3zm0 5h9v2H3zm14 0v-3h2v3h3v2h-3v3h-2v-3h-3v-2z"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M9.500 17.500 4 12l1.400-1.400 4.100 4.100 9.100-9.100L20 7.000z"/></symbol>
  <symbol id="gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.500" stroke-width="3" stroke-dasharray="3.340 3.340"/><circle cx="12" cy="12" r="7" stroke-width="2"/><circle cx="12" cy="12" r="2.600" stroke-width="2"/></g></symbol>
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
  <symbol id="grip" viewBox="0 0 24 24"><path d="M4 8h16v2H4zm0 6h16v2H4z"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
</defs></svg>

<header>
  <h1>Index of sound — mockups v3</h1>
  <p>home · queue · settings · swipe a song right on Home and watch the Queue update. Light / dark lives in Settings.</p>
</header>

<div class="row">

<!-- 1 HOME -->
<figure><figcaption>01 — home (recents) · swipe a song right →</figcaption>
<div class="phone"><div class="scroll">
  <div class="top"><span></span><button id="gear" aria-label="Settings"><svg width="22" height="22"><use href="#gear"/></svg></button></div>
  <h2>Good evening</h2>
  <div class="sub" style="margin-bottom:14px">pick up where you left off</div>
  <div class="tiles">
    <div class="tile"><div class="collage"><div class="art a1"></div><div class="art a2"></div><div class="art a3"></div><div class="art a4"></div></div><span>Late drive</span></div>
    <div class="tile"><div class="art a5"></div><span>Sunday kitchen</span></div>
    <div class="tile"><div class="art a2"></div><span>Mojo</span></div>
    <div class="tile"><div class="art a1"></div><span>Blonde</span></div>
    <div class="tile"><div class="collage"><div class="art a6"></div><div class="art a3"></div><div class="art a1"></div><div class="art a2"></div></div><span>Punjabi mellow</span></div>
    <div class="tile"><div class="art a4"></div><span>Halo Fields</span></div>
  </div>
  <div class="sect"><b>Recently played</b><span>swipe → queue</span></div>
  <div id="recent"></div>
</div>
<div class="toast" id="toast"><span id="tmsg">Added to queue</span><span id="tpos" style="opacity:.6"></span></div>
<div class="mini"><div class="art a1"></div><div class="t"><b style="font-weight:500">Nights</b><span class="sub" style="display:block">Frank Ocean</span></div>
  <svg width="22" height="22"><use href="#queue"/></svg><span class="badge" id="qb" style="margin:0 8px 0 -6px">0</span><svg width="26" height="26"><use href="#pause"/></svg></div>
<div class="tabs"><span class="on">home</span><span>library</span><span>search</span></div>
</div></figure>

<!-- 2 QUEUE -->
<figure><figcaption>02 — queue (live: reflects swipes from Home)</figcaption>
<div class="phone"><div class="scroll q">
  <div class="top"><button><svg width="22" height="22"><use href="#back"/></svg></button><button id="clear" class="sub">clear queue</button></div>
  <h2>Queue</h2>
  <div class="help" id="help"><b>How it works:</b> swipe any song right to add it here. Drag ≡ to reorder, ✕ to remove, tap to play now.</div>

  <div class="grp"><b>Now playing</b></div>
  <div class="li"><div class="art a1"></div><div class="t"><b style="color:var(--accent)">Nights</b><span>Frank Ocean</span></div><div class="eq"><i></i><i></i><i></i></div></div>

  <div class="grp"><b>Next in queue</b><span id="ucount">0 songs</span></div>
  <div class="note">You added these. They play first.</div>
  <div id="user"></div>

  <div class="grp"><b>Next from Late drive</b><span>21 songs</span></div>
  <div class="note">Plays automatically after your queue.</div>
  <div class="li"><div class="art a2"></div><div class="t"><b>Mojo</b><span>Dil Saeed</span></div></div>
  <div class="li"><div class="art a3"></div><div class="t"><b>Says</b><span>Nils Frahm</span></div></div>
  <div class="li"><div class="art a4"></div><div class="t"><b>Halo</b><span>Aya</span></div></div>
  <div class="li"><div class="art a5"></div><div class="t"><b>Dust</b><span>Mazzy Star</span></div></div>
</div></div></figure>

<!-- 3 SETTINGS -->
<figure><figcaption>03 — settings (opened from the gear)</figcaption>
<div class="phone"><div class="scroll set">
  <div class="top"><button><svg width="22" height="22"><use href="#back"/></svg></button><span></span></div>
  <h2>Settings</h2>

  <div class="grp"><b>Appearance</b></div>
  <div class="item"><span>Theme</span><div class="seg" id="seg"><button data-m="light">Light</button><button data-m="dark">Dark</button><button data-m="system" class="on">System</button></div></div>

  <div class="grp"><b>Library</b></div>
  <div class="item"><span>Server<small>jellyfin.home:8096</small></span><span class="v">change ›</span></div>
  <div class="item"><span>Sync now<small>last synced 2 min ago</small></span><span class="v">↻</span></div>
  <div class="item"><span>Show Discover on Home<small>search &amp; add new music</small></span><div class="tg on"></div></div>
  <div class="item"><span>Hidden playlists</span><span class="v">2 ›</span></div>

  <div class="grp"><b>Playback</b></div>
  <div class="item"><span>Streaming quality</span><span class="v">Original ›</span></div>
  <div class="item"><span>Crossfade</span><div class="tg"></div></div>
  <div class="item"><span>Normalize volume</span><div class="tg on"></div></div>

  <div class="grp"><b>Downloads</b></div>
  <div class="item"><span>Storage used<small>6 playlists · 412 songs</small></span><span class="v">2.3 GB ›</span></div>
  <div class="item"><span>Download over cellular</span><div class="tg"></div></div>

  <div class="grp"><b>Account</b></div>
  <div class="item"><span>Signed in as<small>tej @ jellyfin.home</small></span></div>
  <div class="item"><span class="danger">Sign out</span></div>
  <p class="sub" style="margin-top:18px">Index of sound · v0.1</p>
</div></div></figure>

</div>

<script>
const $=id=>document.getElementById(id);
const ico=(n,s)=>`<svg width="${s}" height="${s}"><use href="#${n}"/></svg>`;

/* ---------- theme (Settings) ---------- */
const root=document.documentElement;
$('seg').onclick=e=>{const m=e.target.dataset.m;if(!m)return;
  [...$('seg').children].forEach(b=>b.classList.toggle('on',b===e.target));
  if(m==='system')root.removeAttribute('data-theme');else root.dataset.theme=m;};
document.querySelectorAll('.tg').forEach(t=>t.onclick=()=>t.classList.toggle('on'));

/* ---------- queue state ---------- */
const songs=[
 {t:'Cranes in the Sky',a:'Solange',c:'a4'},{t:'Work',a:'Rihanna',c:'a5'},
 {t:'Slow burn',a:'Kacey Musgraves',c:'a6'},{t:'Dust',a:'Mazzy Star',c:'a5'},
 {t:'Says',a:'Nils Frahm',c:'a3'},{t:'Mojo',a:'Dil Saeed',c:'a2'}];
let uq=[];

/* ---------- recent list with swipe-to-queue ---------- */
const rec=$('recent');
rec.innerHTML=songs.map((s,i)=>`
 <div class="sw" data-i="${i}">
   <div class="bg"><div class="ic"><span class="q">${ico('queue',20)}</span><span class="ck">${ico('check',20)}</span></div><span class="lbl">add to queue</span></div>
   <div class="fg li"><div class="art ${s.c}"></div><div class="t"><b>${s.t}</b><span>${s.a}</span></div><button class="dots">${ico('dots',20)}</button></div>
 </div>`).join('');
// stack the two icons in one box
rec.querySelectorAll('.ic span').forEach(s=>{s.style.cssText='position:absolute;inset:0;transition:opacity .2s,transform .25s'});
rec.querySelectorAll('.ic .ck').forEach(s=>{s.style.opacity=0;s.style.transform='scale(.4)'});

let toastT;
function toast(msg,pos){ $('tmsg').textContent=msg;$('tpos').textContent=pos;$('toast').classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),1600)}

rec.querySelectorAll('.sw').forEach(sw=>{
  const fg=sw.querySelector('.fg'),bg=sw.querySelector('.bg'),lbl=sw.querySelector('.lbl'),ic=sw.querySelectorAll('.ic span');
  let x0=null,dx=0;
  fg.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;fg.classList.remove('snap');sw.classList.remove('done');fg.setPointerCapture(e.pointerId)});
  fg.addEventListener('pointermove',e=>{ if(x0===null)return;
    dx=Math.max(0,Math.min(120,(e.clientX-x0)*.8)); fg.style.transform=`translateX(${dx}px)`;
    bg.style.animation='none';bg.style.opacity=Math.min(1,dx/70);
    lbl.textContent=dx>70?'release to add':'add to queue'});
  const end=()=>{ if(x0===null)return; x0=null;
    fg.classList.add('snap');fg.style.transform='';
    if(dx>70){ add(+sw.dataset.i); sw.classList.add('done');lbl.textContent='added';
      ic[0].style.cssText+=';opacity:0;transform:scale(.4)';ic[1].style.cssText+=';opacity:1;transform:none';
      bg.style.opacity='';bg.style.animation='';
      setTimeout(()=>{ic[0].style.opacity=1;ic[0].style.transform='none';ic[1].style.opacity=0;ic[1].style.transform='scale(.4)';
        sw.classList.remove('done');bg.style.opacity=0;lbl.textContent='add to queue'},950);
    } else { bg.style.opacity=0 }
    dx=0 };
  fg.addEventListener('pointerup',end);fg.addEventListener('pointercancel',end);
});

function add(i){ uq.push({...songs[i]}); renderQ(); toast('Added to queue','#'+uq.length+' up next'); }

/* ---------- queue render ---------- */
function renderQ(){
  $('qb').textContent=uq.length; $('ucount').textContent=uq.length+(uq.length===1?' song':' songs');
  $('user').innerHTML=uq.length?uq.map((s,i)=>`
    <div class="li" draggable="true" data-i="${i}">
      <div class="art ${s.c}"></div><div class="t"><b>${s.t}</b><span>${s.a}</span></div>
      <button class="x" data-x="${i}">${ico('x',18)}</button><span class="h">${ico('grip',18)}</span>
    </div>`).join(''):`<div class="empty">Nothing queued yet.<br>Swipe a song right on Home.</div>`;
}
$('user').onclick=e=>{const b=e.target.closest('[data-x]');if(b){uq.splice(+b.dataset.x,1);renderQ()}};
$('clear').onclick=()=>{uq=[];renderQ()};
let from=null;
$('user').addEventListener('dragstart',e=>{const r=e.target.closest('.li');if(!r)return;from=+r.dataset.i;r.classList.add('drag')});
$('user').addEventListener('dragover',e=>e.preventDefault());
$('user').addEventListener('drop',e=>{const r=e.target.closest('.li');if(!r||from===null)return;
  const to=+r.dataset.i;uq.splice(to,0,uq.splice(from,1)[0]);from=null;renderQ()});
$('user').addEventListener('dragend',()=>renderQ());

// start with two songs so the queue isn't empty on first look
uq=[{...songs[0]},{...songs[1]}];renderQ();
</script>
</body>
</html>
